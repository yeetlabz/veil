<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Veil</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div class="aurora"></div>

  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
          <line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>
        </svg>
      </div>
      <div>
        <h1>Veil</h1>
        <p id="status-line">Watching in real-time</p>
      </div>
    </div>
    <div class="pulse-wrap">
      <div id="pulse-dot"></div>
    </div>
  </header>

  <main>
    <div class="input-wrap">
      <div class="input-glow"></div>
      <div class="input-group">
        <svg class="input-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="keyword-input" type="text" placeholder="Add a keyword or domain…" autocomplete="off" spellcheck="false" />
        <button id="add-btn" aria-label="Add keyword">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>

    <div class="section-label">
      <span>Blocked keywords</span>
      <span id="keyword-count" class="count-pill">0</span>
    </div>

    <div id="chip-container">
      <p id="empty-msg">No keywords yet — add one above to get started.</p>
    </div>
  </main>

  <footer>
    <button id="run-btn">
      <svg id="run-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      <span id="run-label">Scan all history</span>
    </button>
    <div id="result-badge" class="hidden"></div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
